<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول للشبكة</title>
    <!-- سكربت Google الأساسي -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 300px; text-align: center; }
        h2 { margin-top: 0; color: #333; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .recaptcha-box { display: flex; justify-content: center; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>تسجيل الدخول للشبكة</h2>
        <p style="font-size: 12px; color: #666;">أدخل بياناتك للاتصال بالإنترنت</p>
        
        <form>
            <input type="text" placeholder="اسم المستخدم" required>
            <input type="password" placeholder="كلمة المرور" required>
            
            <!-- هنا يظهر مربع التحقق -->
            <div class="g-recaptcha recaptcha-box" data-sitekey= "6LchbhAuAAAAABMYGti52bwuQglRsntBwdov8l3n"></div>
            
            <button type="submit">اتصال</button>
        </form>
    </div>

</body>
          </html>
